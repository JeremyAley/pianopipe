[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pianopipe"
version = "0.1.0"
description = "Piano MIDI in; difficulty levels, fingering, grades and catalog.json out (for Quest Piano Trainer)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy Aley" }]
requires-python = ">=3.10"
dependencies = ["mido>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Source = "https://github.com/JeremyAley/pianopipe"

[project.scripts]
pianopipe = "pianopipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
